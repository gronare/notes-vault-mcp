apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: notes-vault-mcp
  labels:
    app: notes-vault-mcp
spec:
  ingressClassName: REPLACE_ME
  tls:
    - hosts:
        - vault.example.com
      secretName: notes-vault-mcp-tls
  rules:
    - host: vault.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: notes-vault-mcp
                port:
                  name: http
