apiVersion: v1
kind: Secret
metadata:
  name: notes-vault-mcp
  labels:
    app: notes-vault-mcp
type: Opaque
stringData:
  VAULT_PUBLIC_URL: https://vault.example.com
  S3_ENDPOINT: https://s3.example.com
  S3_BUCKET: vault
  S3_ACCESS_KEY: REPLACE_ME
  S3_SECRET_KEY: REPLACE_ME
  # Read only with --auth oidc; VAULT_OIDC_ISSUER is required there and the deployment's args must say oidc.
  VAULT_OIDC_ISSUER: https://id.example.com
  VAULT_OIDC_AUDIENCE: REPLACE_ME
  VAULT_OIDC_READ_GROUP: vault
  VAULT_OIDC_WRITE_GROUP: vault-writers
