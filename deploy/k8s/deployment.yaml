apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: notes-vault-mcp
  labels:
    app: notes-vault-mcp
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notes-vault-mcp
  labels:
    app: notes-vault-mcp
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: notes-vault-mcp
  template:
    metadata:
      labels:
        app: notes-vault-mcp
    spec:
      containers:
        - name: notes-vault-mcp
          image: ghcr.io/gronare/notes-vault-mcp:v0.3.0
          args:
            - serve
            - --transport
            - http
            - --host
            - 0.0.0.0
            - --port
            - "8765"
            - --auth
            - builtin
          envFrom:
            - secretRef:
                name: notes-vault-mcp
          ports:
            - name: http
              containerPort: 8765
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /.well-known/oauth-protected-resource/mcp
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /.well-known/oauth-protected-resource/mcp
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: notes-vault-mcp
