services:
  vault:
    image: ghcr.io/gronare/notes-vault-mcp:0.3.0
    command: serve --transport http --host 0.0.0.0 --port 8765 --auth builtin
    restart: unless-stopped
    env_file: .env
    environment:
      VAULT_AUTH_DIR: /data/auth
      VAULT_CACHE_DIR: /data/cache
    volumes:
      - vault-data:/data
    expose:
      - "8765"

  caddy:
    image: caddy:2
    restart: unless-stopped
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - vault

volumes:
  vault-data:
  caddy-data:
  caddy-config:
