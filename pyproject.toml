[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "notes-vault-mcp"
version = "0.2.2"
description = "MCP server for a markdown notes vault on S3 or a local directory, with a SQLite index, schema-aware writes and session hooks."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Carl Green", email = "carl.green@gronare.se" }]
keywords = ["mcp", "obsidian", "notes", "vault", "s3"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = [
    "mcp>=1.16",
    "boto3>=1.34.0",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/gronare/notes-vault-mcp"
Repository = "https://github.com/gronare/notes-vault-mcp"

[project.scripts]
notes-vault-mcp = "notes_vault_mcp.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "moto>=5.0",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["notes_vault_mcp"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
