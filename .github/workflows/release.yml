name: Release

on:
  push:
    tags: ["v*"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run pytest -q

  pypi:
    needs: [test]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@release/v1

  ghcr:
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/gronare/notes-vault-mcp:${{ github.ref_name }}
            ghcr.io/gronare/notes-vault-mcp:latest
          labels: io.modelcontextprotocol.server.name=io.github.gronare/notes-vault-mcp

  registry:
    needs: [pypi, ghcr]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Match server.json to the tag
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          jq --arg v "$VERSION" '.version = $v | .packages[0].version = $v' server.json > server.json.tmp
          mv server.json.tmp server.json

      - name: Install mcp-publisher
        run: |
          OS="$(uname -s | tr '[:upper:]' '[:lower:]')"
          ARCH="$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')"
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_${OS}_${ARCH}.tar.gz" | tar xz mcp-publisher

      - name: Log in to the MCP registry
        run: ./mcp-publisher login github-oidc

      - name: Publish
        run: |
          for attempt in 1 2 3 4 5; do
            ./mcp-publisher publish && exit 0
            echo "publish failed, PyPI may not have the release yet; retrying in 30s"
            sleep 30
          done
          exit 1

  plugin:
    needs: [pypi]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          repository: gronare/claude-plugins
          ref: main
          ssh-key: ${{ secrets.CLAUDE_PLUGINS_DEPLOY_KEY }}

      - name: Point the vault plugin at this release
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          if grep -q "notes-vault-mcp==${VERSION}\"" plugins/vault/.mcp.json; then
            echo "the plugin already pins ${VERSION}"
            exit 0
          fi
          sed -i -E "s/notes-vault-mcp==[0-9.]+/notes-vault-mcp==${VERSION}/g" plugins/vault/.mcp.json plugins/vault/hooks/hooks.json
          PLUGIN="$(jq -r '.version' plugins/vault/.claude-plugin/plugin.json | awk -F. '{print $1"."$2"."$3+1}')"
          jq --arg v "$PLUGIN" '.version = $v' plugins/vault/.claude-plugin/plugin.json > plugin.json.tmp
          mv plugin.json.tmp plugins/vault/.claude-plugin/plugin.json
          git config user.name "notes-vault-mcp release"
          git config user.email "release@notes-vault-mcp.invalid"
          git add plugins/vault/.mcp.json plugins/vault/hooks/hooks.json plugins/vault/.claude-plugin/plugin.json
          git commit -m "vault ${PLUGIN}: the server and the hooks pin notes-vault-mcp==${VERSION}"
          git push origin HEAD:main
