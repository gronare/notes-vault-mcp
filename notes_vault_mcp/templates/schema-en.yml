version: 1
language: en
folders:
  Areas:     { kind: system,    weight: 3.0, description: "One living note per system or subsystem. Current state only. Hub of the graph." }
  Resources: { kind: reference, weight: 2.0, description: "Gotchas, how-tos and decisions with rationale. Written once, valid until superseded_by." }
  Projects:  { kind: task,      weight: 1.0, description: "Open work that spans sessions. Closed with close." }
  Log:       { kind: log,       weight: 1.0, description: "Append-only log per repo and compiled monthly pages." }
  Archive:   { kind: archive,   weight: 0.3, searched: false, description: "History. Searched only on request." }
frontmatter:
  required: [title, date, updated, tags, status]
  optional: [kind, area, summary, path, superseded_by, priority, source]
  area_required_in: [Projects, Resources, Log]
  status_values: [draft, active, backlog, complete, superseded]
  kind_values: [system, task, trap, howto, decision, reference, log]
  priority_values: [urgent, high, medium, low]
tags:
  strict: false
  vocabulary: []
synonyms: []
log:
  folder: Log
stale_after_days: 30
